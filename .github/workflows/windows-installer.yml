name: Windows Installer

# Genera los instaladores AGTech-<versión>.msi y .exe en un runner Windows de GitHub.
# No necesitas un PC Windows: pulsa "Run workflow" y descarga el artefacto.
# En un tag v* además publica una Release con los instaladores (auto-update).

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Asegurar WiX Toolset 3.x
        shell: pwsh
        run: |
          $found = Get-ChildItem "C:\Program Files (x86)\WiX Toolset v3.*\bin\candle.exe" `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $found) {
            choco install wixtoolset --version=3.14.1 -y --no-progress
            $found = Get-ChildItem "C:\Program Files (x86)\WiX Toolset v3.*\bin\candle.exe" `
              -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $found) { throw "WiX Toolset 3.x no encontrado" }
          $found.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Compilar MSI y EXE
        shell: pwsh
        run: .\gradlew.bat --no-daemon packageMsi packageExe

      - name: Subir instaladores
        uses: actions/upload-artifact@v4
        with:
          name: AGTech-Windows
          path: |
            build/compose/binaries/main/msi/*.msi
            build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

      - name: Limpiar assets de versiones anteriores
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' 2>/dev/null | while read -r n; do
            [ -z "$n" ] && continue
            if [ "$n" != "AGTech-$V.msi" ] && [ "$n" != "AGTech-$V.exe" ]; then
              echo "Borrando asset antiguo: $n"
              gh release delete-asset "$GITHUB_REF_NAME" "$n" -y || true
            fi
          done

      - name: Publicar release (tags v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: AGTech NAS ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/compose/binaries/main/msi/*.msi
            build/compose/binaries/main/exe/*.exe
          fail_on_unmatched_files: true
